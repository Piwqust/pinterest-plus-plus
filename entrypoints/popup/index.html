<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinterest Plus Plus</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup">
      <header class="head">
        <img class="mark" src="/icon/48.png" width="34" height="34" alt="" />
        <div class="head-text">
          <h1 class="title">Pinterest++</h1>
          <p class="subtitle" id="version">Version</p>
        </div>
      </header>

      <section class="card" aria-labelledby="width-heading">
        <div class="card-head">
          <h2 class="label" id="width-heading">Grid tile width</h2>
          <output class="value" id="value" for="range">236 px</output>
        </div>
        <input
          class="range"
          id="range"
          type="range"
          min="160"
          max="420"
          step="4"
          value="236"
          aria-labelledby="width-heading"
        />
        <div class="card-foot">
          <p class="note" id="note">Applies to open Pinterest tabs.</p>
          <button class="reset" id="reset" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
            Reset
          </button>
        </div>
      </section>

      <section class="card" aria-labelledby="placement-heading">
        <h2 class="label" id="placement-heading">Pin buttons</h2>
        <div class="choices" role="radiogroup" aria-labelledby="placement-heading">
          <label class="choice">
            <input type="radio" name="placement" value="overlay" checked />
            <span class="choice-body">
              <svg class="choice-art" viewBox="0 0 64 44" aria-hidden="true">
                <rect class="art-media" x="12" y="2" width="40" height="40" rx="6" />
                <rect class="art-pill" x="16" y="30" width="24" height="8" rx="2.5" />
                <rect class="art-dot" x="18.5" y="32.5" width="4" height="3" rx="1" />
                <rect class="art-dot" x="26" y="32.5" width="4" height="3" rx="1" />
                <rect class="art-dot" x="33.5" y="32.5" width="4" height="3" rx="1" />
              </svg>
              <span class="choice-text">On the image</span>
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="placement" value="menu" />
            <span class="choice-body">
              <svg class="choice-art" viewBox="0 0 64 44" aria-hidden="true">
                <rect class="art-media" x="12" y="2" width="40" height="30" rx="6" />
                <rect class="art-line" x="13" y="37" width="10" height="3" rx="1.5" />
                <rect class="art-dot" x="25.5" y="36.5" width="4" height="4" rx="1" />
                <rect class="art-dot" x="32" y="36.5" width="4" height="4" rx="1" />
                <rect class="art-dot" x="38.5" y="36.5" width="4" height="4" rx="1" />
                <circle class="art-more" cx="45.5" cy="38.5" r=".9" />
                <circle class="art-more" cx="48.5" cy="38.5" r=".9" />
                <circle class="art-more" cx="51.5" cy="38.5" r=".9" />
              </svg>
              <span class="choice-text">Next to <span class="more">⋯</span></span>
            </span>
          </label>
        </div>
        <p class="note" id="placement-note">Over a pin's image while you point at it.</p>
      </section>

      <section class="card" aria-labelledby="collection-heading">
        <div class="card-head">
          <h2 class="label" id="collection-heading">Collection</h2>
          <output class="value" id="collected">0 pins</output>
        </div>
        <div class="switches">
          <label class="switch">
            <input type="checkbox" role="switch" id="skip-ads" checked />
            <span>Skip ads when scanning</span>
          </label>
          <label class="switch">
            <input type="checkbox" role="switch" id="skip-repeats" />
            <span>Skip pins collected before</span>
          </label>
        </div>
        <p class="note" id="collection-note">Scan, filter and save pins from the <b>Collection</b> button in Pinterest's corner.</p>
      </section>

      <footer class="foot">
        <button class="open" id="open" type="button">
          Open Pinterest
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7" /><path d="M8 7h9v9" /></svg>
        </button>
        <a class="link" id="privacy" href="https://piwqust.github.io/pinterest-plus-plus/" target="_blank" rel="noreferrer">Privacy</a>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
